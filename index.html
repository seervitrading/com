<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seervi Trading Category Images</title>
<style>
body{margin:0;background:#080a0d;color:#f4f6f8;font-family:Arial,sans-serif;padding:24px}
h1{font-size:24px;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:#10141a;border:1px solid #242a32;border-radius:14px;padding:12px}
.card img{width:100%;aspect-ratio:1.5/1;object-fit:cover;border-radius:10px;display:block}
.name{font-weight:700;margin:12px 4px 4px}
.file{font-size:13px;color:#9ca6b2;margin:0 4px}
</style>
</head>
<body>
<h1>Seervi Trading — Category Images</h1>
<div class="grid">
  <div class="card"><img src="ms-blades.webp" alt="MS Blades"><div class="name">MS Blades</div><p class="file">ms-blades.webp</p></div>
  <div class="card"><img src="wall-blades.webp" alt="Wall Blades"><div class="name">Wall Blades</div><p class="file">wall-blades.webp</p></div>
  <div class="card"><img src="wall-fixed.webp" alt="Wall Fixed TV Stands"><div class="name">Wall Fixed</div><p class="file">wall-fixed.webp</p></div>
</div>
</body>
</html>
